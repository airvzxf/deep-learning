name: Game generator

on:
  push:
    branches: [main]
    paths:
      - 'src/tic-tac-toe/game-generator/**'
      - '.github/workflows/game-generator.yml'
  pull_request:
    paths:
      - 'src/tic-tac-toe/game-generator/**'
      - '.github/workflows/game-generator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    defaults:
      run:
        working-directory: src/tic-tac-toe/game-generator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: src/tic-tac-toe/game-generator/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: BDD tests
        run: behave tests/bdd
      - name: Generate random games
        run: |
          python main.py -n 10000 -f random.csv
          test "$(wc -l < random.csv)" -eq 10001
      - name: Generate every game
        run: |
          python main.py --exhaustive -f all.csv
          test "$(wc -l < all.csv)" -eq 255169
